# transaction_mode=IMMEDIATE: every transaction takes SQLite's write lock when it
# begins, so concurrent writers queue up (for up to busy_timeout ms) instead of
# failing at once with SQLITE_BUSY. With the default DEFERRED mode, two first-time
# logins at the same moment both read, then both try to write, and one of them
# got a 500 from POST /api/local-auth.
spring.datasource.url=jdbc:sqlite:${LS_SQLITE_PATH:../../.self-host/lobby.sqlite}?transaction_mode=IMMEDIATE&busy_timeout=10000
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.sqlite.hibernate.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.datasource.username=
spring.datasource.password=
hibernate.hbm2ddl.auto=update
